# wist-agentd 采集工作任务清单——macOS P0（低稳定度内容，独立于运行设定）
#
# 由 agentd.toml 的 [telemetry.logs] file_inputs_file 引用（路径相对配置文件）。
# 增删/调整采集任务只改本文件；运行设定见上级 agentd.toml。
#
# 字段语义与内联 [[telemetry.logs.file_inputs]] 一致：
#   input_id         唯一标识（数据面 WPL 规则按它分流/打 category）
#   path             待采集日志文件（只支持"可追加的单个文本文件"）
#   startup_position tail=只收新增行（推荐，防大文件历史重放）；head=从文件头回放一次
#   multiline_mode   目前仅支持 none
#
# 权限：install/launchd 等多数路径普通用户可读；wifi.log 需 admin 组；
# 需要 root/Full Disk Access 的路径在用户态会读取失败并进 spool 重试。
[[file_inputs]]
input_id = "macos_install_log"
path = "/var/log/install.log"
startup_position = "tail"
multiline_mode = "none"

[[file_inputs]]
input_id = "macos_launchd"
path = "/var/log/com.apple.xpc.launchd/launchd.log"
startup_position = "tail"
multiline_mode = "none"

[[file_inputs]]
input_id = "macos_shutdown_monitor"
path = "/var/log/shutdown_monitor.log"
startup_position = "tail"
multiline_mode = "none"

[[file_inputs]]
input_id = "macos_fsck"
path = "/var/log/fsck_apfs.log"
startup_position = "tail"
multiline_mode = "none"

[[file_inputs]]
input_id = "macos_wifi"
path = "/var/log/wifi.log"
startup_position = "tail"
multiline_mode = "none"
