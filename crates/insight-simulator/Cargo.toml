insight-control = { path = "../insight-control" }
wist-reporting = { path = "../wist-reporting" }
wist-shared = { path = "../../../wist-shared" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "insight-simulator"
path = "src/main.rs"
